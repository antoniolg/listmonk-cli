name: Release CLI + Homebrew

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true

permissions:
  contents: write

env:
  BIN_NAME: listmonk
  FORMULA_NAME: listmonk-cli
  HOMEBREW_TAP_REPO: antoniolg/homebrew-tap
  GH_REPO: antoniolg/listmonk-cli

jobs:
  build-release-cli:
    name: build-release-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "tag is required" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout selected tag (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git checkout "${{ steps.vars.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build and test
        shell: bash
        run: |
          npm ci
          npm test
          npm prune --omit=dev
          chmod +x dist/index.js

      - name: Build CLI archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          PACKAGE_DIR="release-package/${FORMULA_NAME}_${VERSION}"
          ARCHIVE="dist/${FORMULA_NAME}_${VERSION}.tar.gz"

          rm -rf release-package
          mkdir -p "${PACKAGE_DIR}"
          cp -R dist "${PACKAGE_DIR}/dist"
          cp -R node_modules "${PACKAGE_DIR}/node_modules"
          cp package.json package-lock.json README.md "${PACKAGE_DIR}/"
          tar -C "${PACKAGE_DIR}" -czf "${ARCHIVE}" .

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.vars.outputs.tag }}" \
            "dist/${FORMULA_NAME}_${{ steps.vars.outputs.version }}.tar.gz" \
            --repo "${GH_REPO}" \
            --clobber

      - name: Compute checksum
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          SUM="$(sha256sum "dist/${FORMULA_NAME}_${VERSION}.tar.gz" | awk '{print $1}')"
          echo "sha256=${SUM}" >> "${GITHUB_OUTPUT}"

      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not configured; skipping Homebrew formula update."
            exit 0
          fi
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="${{ steps.vars.outputs.tag }}"
          FORMULA_NAME="${FORMULA_NAME}"
          BIN_NAME="${BIN_NAME}"
          GH_REPO="${GH_REPO}"

          TAP_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "${TAP_DIR}"

          cat > "${TAP_DIR}/Formula/${FORMULA_NAME}.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file was generated by GitHub Actions. DO NOT EDIT.
          class ListmonkCli < Formula
            desc "CLI for Listmonk campaigns, lists, subscribers, templates, and transactional emails."
            homepage "https://github.com/${GH_REPO}"
            url "https://github.com/${GH_REPO}/releases/download/${TAG}/${FORMULA_NAME}_${VERSION}.tar.gz"
            sha256 "${{ steps.sums.outputs.sha256 }}"
            version "${VERSION}"

            depends_on "node"

            def install
              libexec.install Dir["*"]
              chmod 0755, libexec/"dist/index.js"
              (bin/"${BIN_NAME}").write <<~EOS
                #!/bin/bash
                exec "#{Formula["node"].opt_bin}/node" "#{libexec}/dist/index.js" "\$@"
              EOS
            end

            test do
              system "#{bin}/${BIN_NAME}", "--help"
            end
          end
          EOF

          cd "${TAP_DIR}"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No Homebrew changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "Formula/${FORMULA_NAME}.rb"
          git commit -m "${FORMULA_NAME} ${TAG}"
          git push origin main
